<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" aria-hidden="true">
  <defs>
    <filter id="libra-star-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Real Libra constellation: β (top, brightest) — γ (upper right) — α (left fulcrum) — σ (pendant below α) -->
  <g stroke="currentColor" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <line x1="118" y1="40"  x2="166" y2="86"/>
    <line x1="118" y1="40"  x2="56"  y2="96"/>
    <line x1="56"  y1="96"  x2="166" y2="86"/>
    <line x1="56"  y1="96"  x2="80"  y2="166"/>
  </g>

  <!-- Cross diffraction spikes on the brightest star (β Lib) -->
  <g stroke="currentColor" stroke-width="1" opacity="0.55" stroke-linecap="round">
    <line x1="118" y1="22" x2="118" y2="58"/>
    <line x1="100" y1="40" x2="136" y2="40"/>
  </g>

  <!-- 4 Libra main stars with soft halo -->
  <g fill="currentColor" filter="url(#libra-star-glow)">
    <circle class="libra-star libra-star--beta"  cx="118" cy="40"  r="6.5"/>
    <circle class="libra-star libra-star--gamma" cx="166" cy="86"  r="4"/>
    <circle class="libra-star libra-star--alpha" cx="56"  cy="96"  r="5"/>
    <circle class="libra-star libra-star--sigma" cx="80"  cy="166" r="4.5"/>
  </g>
</svg>
